[build-system]

requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pychor"
description = "Library-based choreographic programming for Python"
authors = [{name = "Joseph Near", email = "jnear@uvm.edu"}]
version = "0.2.4"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

[project.urls]
Documentation = "https://uvm-plaid.github.io/pychor/"
Repository = "https://github.com/uvm-plaid/pychor"

[project.optional-dependencies]
examples = [
     "galois",
     "pynacl",
     "numpy",
     "scipy",
     "pandas",
     "matplotlib",
     ]
docs = [
     "mkdocs>=1.6",
     "mkdocs-material>=9.5",
     "mkdocstrings[python]>=0.25",
     ]

[tool.setuptools.packages.find]
include = ["pychor*"]
