[build-system]

requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pychor"
description = "Library-based choreographic programming for Python"
authors = [{name = "Joseph Near", email = "jnear@uvm.edu"}]
version = "0.4.2"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"

[project.urls]
Documentation = "https://uvm-plaid.github.io/pychor/"
Repository = "https://github.com/uvm-plaid/pychor"

[project.optional-dependencies]
examples = [
     "galois",
     "pynacl",
     "numpy",
     "scipy",
     "pandas",
     "matplotlib",
     ]
docs = [
     "mkdocs>=1.6",
     "mkdocs-material>=9.5",
     "mkdocstrings[python]>=0.25",
     ]
test = [
     "pytest>=7.4",
     ]

[tool.setuptools.packages.find]
include = ["pychor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The examples import `example_backend` as a top-level module, so the examples
# directory has to be importable for the tests that call into them directly.
pythonpath = ["examples"]
addopts = "-ra"
markers = [
    "slow: long-running; select with --runslow",
    "tcp: real multi-process TCP deployment; select with --runslow",
]
