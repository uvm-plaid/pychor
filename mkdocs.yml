site_name: PyChor
site_description: Library-based choreographic programming for Python
site_url: https://uvm-plaid.github.io/pychor/
repo_url: https://github.com/uvm-plaid/pychor
repo_name: uvm-plaid/pychor

nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorial: tutorial.md
  - Concepts: concepts.md
  - Backends: backends.md
  - Examples: examples.md
  - API Reference: api.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            docstring_options:
              returns_multiple_items: false
              warn_unknown_params: true
            members_order: source
            show_signature_annotations: true
            separate_signature: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: false
            heading_level: 3
